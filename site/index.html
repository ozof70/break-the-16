<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script>if(location.pathname==="/management")location.replace("/management/"+location.search+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>破局十六週｜政大商圈跨域引流 × 假期飯友</title>
<meta name="description" content="動物園 × 政大商圈轉盤優惠券，與心動鈴飯友媒合——讓政大商圈在寒暑假也熱鬧。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div id="hdr"></div>

<main id="top">
<section class="hero">
  <h1 class="hero-title">
    <span class="line reveal" data-i18n="hero.t1">破局</span>
    <span class="line reveal d1" data-i18n="hero.t2">十六週</span>
  </h1>
  <p class="hero-sub reveal d2" data-i18n-html="hero.sub">政大商圈跨域引流 <b>×</b> 假期飯友</p>
  <p class="hero-lead reveal d2" data-i18n="hero.lead">學期縮短、假期拉長，學生一走商圈就空。我們用兩條路把人帶回指南路：讓動物園遊客轉出一張優惠券，讓留校的你找到一起吃飯的人。</p>
  <div class="hero-cta reveal d3">
    <button class="btn btn-ink" data-go="#wheel" data-i18n="hero.cta1">🎡 轉盤優惠券</button>
    <a class="btn btn-ghost" href="bell.html" data-i18n="hero.cta2">🔔 心動鈴找飯友</a>
  </div>
  <div class="hero-shapes" aria-hidden="true">
    <div class="half"><span class="eye"></span><span class="cheek"></span></div>
    <div class="full"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span><span class="cheek l"></span><span class="cheek r"></span></div>
  </div>
  <div class="floaties" aria-hidden="true"><span>🍜</span><span>🧇</span><span>🍔</span><span>☕</span><span>🥟</span><span>💛</span></div>
  <div class="hero-stats reveal d3">
    <div><b data-count="10">0</b><span data-i18n="hero.s1">分鐘公車：動物園到政大</span></div>
    <div><b data-count="12">0</b><span data-i18n="hero.s2">間政大商圈店家</span></div>
    <div><b data-count="3">0</b><span data-i18n="hero.s3">種人數優惠模式</span></div>
  </div>
  <div class="road" aria-hidden="true">
    <div class="sign s-zoo" data-i18n="road.zoo">🦁 動物園</div>
    <div class="sign s-nccu" data-i18n="road.nccu">政大商圈 🍜</div>
    <div class="bus">
      <svg viewBox="0 0 200 110" width="200" height="110">
        <rect x="6" y="14" width="186" height="70" rx="20" fill="#111"/>
        <rect x="160" y="26" width="24" height="30" rx="7" fill="#FFF4A3"/>
        <g class="win"><rect x="20" y="24" width="38" height="34" rx="9" fill="#FFF9D1"/>
          <circle cx="39" cy="45" r="11" fill="#fff" stroke="#111" stroke-width="1.5"/><circle cx="31" cy="35" r="4.5" fill="#111"/><circle cx="47" cy="35" r="4.5" fill="#111"/>
          <ellipse cx="35" cy="44" rx="3" ry="3.6" fill="#111"/><ellipse cx="43" cy="44" rx="3" ry="3.6" fill="#111"/><circle cx="35" cy="44" r="1" fill="#fff"/><circle cx="43" cy="44" r="1" fill="#fff"/><path d="M36 50 q3 3 6 0" stroke="#111" stroke-width="1.4" fill="none"/></g>
        <g class="win w2"><rect x="66" y="24" width="38" height="34" rx="9" fill="#FFF9D1"/>
          <circle cx="74" cy="38" r="6" fill="#9aa0a6"/><circle cx="96" cy="38" r="6" fill="#9aa0a6"/><circle cx="74" cy="38" r="3" fill="#f6c1c1"/><circle cx="96" cy="38" r="3" fill="#f6c1c1"/>
          <circle cx="85" cy="45" r="10" fill="#b5bac0"/><ellipse cx="85" cy="47" rx="3.4" ry="4" fill="#111"/><circle cx="80" cy="42" r="1.6" fill="#111"/><circle cx="90" cy="42" r="1.6" fill="#111"/></g>
        <g class="win w3"><rect x="112" y="24" width="38" height="34" rx="9" fill="#FFF9D1"/>
          <ellipse cx="131" cy="45" rx="11" ry="12" fill="#111"/><ellipse cx="131" cy="48" rx="7" ry="8" fill="#fff"/><circle cx="127" cy="42" r="1.6" fill="#fff"/><circle cx="135" cy="42" r="1.6" fill="#fff"/><path d="M128 46 l3 3 l3 -3z" fill="#F4A261"/></g>
        <rect x="6" y="64" width="186" height="6" fill="#FFE45C"/>
        <g class="wheel" style="transform-origin:50px 86px"><circle cx="50" cy="86" r="15" fill="#111" stroke="#FFF4A3" stroke-width="4"/><path d="M50 74 v24 M38 86 h24" stroke="#FFF4A3" stroke-width="2.5"/></g>
        <g class="wheel" style="transform-origin:152px 86px"><circle cx="152" cy="86" r="15" fill="#111" stroke="#FFF4A3" stroke-width="4"/><path d="M152 74 v24 M140 86 h24" stroke="#FFF4A3" stroke-width="2.5"/></g>
      </svg>
      <span class="puff"></span><span class="puff p2"></span>
    </div>
  </div>
</section>

<div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

<section class="sec" id="wheel">
  <div class="sec-head reveal"><h2 data-i18n="wheel.h">轉盤優惠券</h2><p class="sec-note" data-i18n="wheel.note">在動物園掃 QR Code 進來的你，先告訴我們幾個人。</p></div>
  <div class="wheel-wrap">
    <div class="wheel-side reveal">
      <div class="seg" id="modeSeg" role="tablist">
        <button class="seg-btn active" data-mode="solo" data-i18n="mode.solo.btn">🧍 一人</button>
        <button class="seg-btn" data-mode="duo" data-i18n="mode.duo.btn">👫 二人</button>
        <button class="seg-btn" data-mode="group" data-i18n="mode.group.btn">👨‍👩‍👧‍👦 多人</button>
        <span class="seg-pill"></span>
      </div>
      <p class="mode-desc" id="modeDesc"></p>
      <button class="btn btn-ink btn-lg" id="spinBtn" data-i18n="wheel.spin">SPIN · 轉出優惠</button>
      <p class="tiny" data-i18n="wheel.terms">每張優惠券標明最低消費、適用時段與人數；實際優惠以店家現場公告為準。</p>
    </div>
    <div class="wheel-stage reveal d1">
      <div class="pointer"></div>
      <svg id="wheelSvg" viewBox="-110 -110 220 220"></svg>
      <button class="wheel-hub" id="hubBtn" aria-label="Spin">GO</button>
    </div>
  </div>

  <div class="coupon" id="coupon" hidden>
    <div class="coupon-main">
      <div class="coupon-top"><div class="shop-icon" id="cIcon"></div><div><span class="tag" id="cMode"></span><h3 id="cShop"></h3><p class="muted" id="cAddr"></p></div></div>
      <p class="coupon-offer" id="cOffer"></p>
      <ul class="coupon-rules" id="cRules"></ul>
      <div class="coupon-actions">
        <button class="btn btn-ink" id="redeemBtn" data-i18n="coupon.redeem">出示核銷</button>
        <button class="btn btn-ghost" id="mapBtn" data-i18n="coupon.map">🚌 交通指引</button>
        <button class="btn btn-ghost" id="againBtn" data-i18n="coupon.again">再轉一次</button>
      </div>
      <div class="transit" id="transit" hidden><p data-i18n-html="coupon.transit"></p></div>
    </div>
    <div class="coupon-stub">
      <div class="qr" id="qr"></div>
      <span class="code" id="cCode"></span>
      <div class="stamp" id="stamp" data-i18n="coupon.stamp">已核銷</div>
    </div>
  </div>

  <div class="next-links reveal">
    <a class="next" href="bell.html"><span data-i18n="next.bell.k">假期飯友</span><b data-i18n="next.bell">心動鈴</b></a>
    <a class="next" href="shops.html"><span data-i18n="next.shops.k">政大商圈</span><b data-i18n="next.shops">合作店家</b></a>
    <a class="next" href="about.html"><span data-i18n="next.about.k">我們是誰</span><b data-i18n="next.about">關於我們</b></a>
  </div>
</section>
</main>

<div id="ftr"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
